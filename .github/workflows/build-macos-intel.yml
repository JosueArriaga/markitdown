name: Compilar MarkItDown macOS Intel

on:
  workflow_dispatch:

jobs:
  build-macos-intel:
    runs-on: macos-15-intel

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Actualizar pip
        run: |
          python -m pip install --upgrade pip

      - name: Instalar MarkItDown desde este repositorio
        run: |
          pip install './packages/markitdown[all]'

      - name: Instalar PyInstaller
        run: |
          pip install pyinstaller

      - name: Comprobar MarkItDown
        run: |
          markitdown --help

      - name: Crear ejecutable macOS Intel
        run: |
          pyinstaller \
            --clean \
            --onefile \
            --name markitdown \
            --collect-all markitdown \
            --collect-all magika \
            --recursive-copy-metadata markitdown \
            launcher.py

      - name: Probar ejecutable
        run: |
          ./dist/markitdown --help

      - name: Comprobar arquitectura
        run: |
          file ./dist/markitdown

      - name: Subir ejecutable
        uses: actions/upload-artifact@v4
        with:
          name: markitdown-macos-intel
          path: dist/markitdown
