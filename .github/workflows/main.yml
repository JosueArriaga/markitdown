name: Compilar MarkItDown para Mac
on:
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Clonar el código de Microsoft
        uses: actions/checkout@v4

      - name: Configurar Python temporal en el servidor
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar y compilar con PyInstaller
        run: |
          pip install './packages/markitdown[all]' pyinstaller
          pyinstaller --onefile --name markitdown packages/markitdown/src/markitdown/__main__.py

      - name: Comprimir ejecutable para asegurar descarga
        run: |
          mkdir build_output
          cp dist/markitdown build_output/
          cd build_output && zip -r markitdown-macos.zip markitdown

      - name: Subir el ejecutable terminado
        uses: actions/upload-artifact@v4
        with:
          name: markitdown-macos-binario
          path: build_output/markitdown-macos.zip
          retention-days: 1
